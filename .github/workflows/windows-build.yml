name: Build ALIEN for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      # 1) Checkout code
      - uses: actions/checkout@v4                        

      # 2) CMake installer (no legacy cache)
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2             
        with:
          cmake-version: '3.27.5'                        

      # 3) vcpkg bootstrap (uses new cache APIs)
      - name: Bootstrap vcpkg
        uses: microsoft/vcpkg-action@v2                  

      # 4) Install CUDA Toolkit 12.4
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.22                 
        with:
          cuda: '12.4.0'                                  

      # 5) Configure – embed sm_120 kernels
      - name: Configure with CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCUDA_ARCHITECTURES=120

      # 6) Build
      - name: Build Release
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -- -m

      # 7) Upload the EXE as an artifact
      - name: Upload alien.exe
        uses: actions/upload-artifact@v4                 
        with:
          name: ALIEN-windows
          path: build/Release/alien.exe
