name: Build ALIEN for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest   # or windows-latest

    steps:
      - uses: actions/checkout@v4

      # Replace get-cmake entirely:
      - name: Setup CMake
        uses: actions/setup-cmake@v2
        with:
          cmake-version: '3.27.5'

      - name: Bootstrap vcpkg
        uses: microsoft/vcpkg-action@v2           # uses new cache API&#8203;:contentReference[oaicite:5]{index=5}

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.22         # installs on either runner&#8203;:contentReference[oaicite:6]{index=6}
        with:
          cuda: '12.4.0'

      - name: Configure & Build
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUDA_ARCHITECTURES=120
          cmake --build build --config Release -- -m

      - name: Upload artifact
        uses: actions/upload-artifact@v4         # avoids v3 brown‑outs&#8203;:contentReference[oaicite:7]{index=7}
        with:
          name: alien-exe
          path: build/Release/alien.exe
