name: Build ALIEN Windows

# triggers on push to main and allows manual dispatch
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      # 1) grab your source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) set up a modern CMake (no caching, no legacy service)
      - name: Setup CMake
        uses: actions/setup-cmake@v3
        with:
          # optional: pin a version; runner already has 3.x available
          cmake-version: '3.27.5'

      # 3) bootstrap vcpkg for any C++ deps
      - name: Bootstrap vcpkg
        uses: microsoft/vcpkg-action@v2

      # 4) install CUDA so nvcc is on the PATH
      - name: Install CUDA Toolkit 12.4
        uses: jimmye/cuda-toolkit-action@v0.2.18
        with:
          version: '12.4.0'

      # 5) configure the build (include sm_120 for your RTX 5070)
      - name: Configure with CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCUDA_ARCHITECTURES=120

      # 6) build the Release target
      - name: Build Release
        run: cmake --build build --config Release -- -m

      # 7) upload the finished exe as an artifact
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v3
        with:
          name: ALIEN-windows
          path: build/Release/alien.exe
