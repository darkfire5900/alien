name: Build ALIEN Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      # 1) Check out your source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Install CMake (official action, v2)
      - name: Setup CMake
        uses: actions/setup-cmake@v2
        with:
          cmake-version: '3.27.5'   # or omit to get the default available

      # 3) Bootstrap vcpkg
      - name: Bootstrap vcpkg
        uses: microsoft/vcpkg-action@v2

      # 4) Install CUDA 12.4
      - name: Install CUDA Toolkit
        uses: jimmye/cuda-toolkit-action@v0.2.18
        with:
          version: '12.4.0'

      # 5) Configure—embed sm_120 for RTX 5070
      - name: Configure with CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCUDA_ARCHITECTURES=120

      # 6) Build Release
      - name: Build Release
        run: cmake --build build --config Release -- -m

      # 7) Upload the .exe
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v3
        with:
          name: ALIEN-windows
          path: build/Release/alien.exe
