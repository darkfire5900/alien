name: CI Build ALIEN (Ubuntu + sm_120)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout source
      - uses: actions/checkout@v4

      # 2) (Option A) Install CMake & Ninja without legacy cache
      - name: Install CMake & Ninja
        uses: lukka/get-cmake@v3
        with:
          cmakeVersion: '3.27.5'
          ninjaVersion:  '1.11.1'
          useCloudCache: false    # disable GitHub cache :contentReference[oaicite:5]{index=5}
          useLocalCache: false    # disable runner cache :contentReference[oaicite:6]{index=6}

      #    – OR (Option B) switch to a cache‑free installer
      # - name: Setup CMake
      #   uses: actions/setup-cmake@v2
      #   with:
      #     cmake-version: '3.27.5'

      # 3) Bootstrap vcpkg (uses v2 cache API)
      - name: Bootstrap vcpkg
        uses: microsoft/vcpkg-action@v2             # new cache service :contentReference[oaicite:7]{index=7}

      # 4) Install CUDA Toolkit 12.4
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.22           # Windows+Linux supported :contentReference[oaicite:8]{index=8}
        with:
          cuda: '12.4.0'

      # 5) Configure (embed CC 12.0 kernels for RTX 5070)
      - name: Configure with CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUDA_ARCHITECTURES=120

      # 6) Build
      - name: Build Release
        run: cmake --build build --config Release -- -m

      # 7) Upload artifact (v4 uses new cache service)
      - name: Upload alien.exe
        uses: actions/upload-artifact@v4          # avoid v3 brown‑outs :contentReference[oaicite:9]{index=9}
        with:
          name: ALIEN-windows
          path: build/Release/alien.exe
