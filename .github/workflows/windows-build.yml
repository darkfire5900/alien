name: Build ALIEN Windows

on:
  push:
    branches: [ main ]          # adjust if your default branch differs
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-win:
    runs-on: windows-latest

    steps:
    # 1) Checkout
    - name: Checkout source
      uses: actions/checkout@v4               # maintained, no legacy cache 

    # 2) Install CMake (does NOT use the old cache)
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1   # safe; verified 2025-04 :contentReference[oaicite:2]{index=2}
      with:
        cmake-version: '3.27.5'               # or omit for runner default

    # 3) Bootstrap vcpkg
    - name: Bootstrap vcpkg
      uses: microsoft/vcpkg-action@v2         # official MS action 

    # 4) Install CUDA Toolkit 12.4
    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.22       # latest tag; Windows supported :contentReference[oaicite:3]{index=3}
      with:
        cuda: '12.4.0'

    # 5) Configure for Blackwell (sm_120)
    - name: Configure with CMake
      run: cmake -B build -S . ^
               -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ^
               -DCUDA_ARCHITECTURES=120

    # 6) Build
    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} -- -m

    # 7) Upload executable (must be v4—v3 brown‑outs)
    - name: Upload artifact
      uses: actions/upload-artifact@v4        # v3 is in brown‑out / deprecation :contentReference[oaicite:4]{index=4}
      with:
        name: ALIEN-windows
        path: build/Release/alien.exe
