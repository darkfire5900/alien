name: Build ALIEN for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    defaults:
      run:
        shell: powershell

    steps:
      # 1. Fetch the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install CMake (no legacy cache)
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.2'

      # 3. Install CUDA 12.4 runtime for compatibility
      - name: Install CUDA 12.4 runtime
        run: choco install cuda --version=12.4.1.551 -y

      # 4. Bootstrap native dependencies via vcpkg
      - name: Bootstrap vcpkg dependencies
        uses: microsoft/vcpkg-action@v2

      # 5. Configure ALIEN with Blackwell support
      - name: Configure ALIEN with CUDA sm_120
        run: cmake -S . -B build \
             -G "Visual Studio 17 2022" -A x64 \
             -DCMAKE_BUILD_TYPE=Release \
             -DCUDA_ARCHITECTURES=120

      # 6. Build the project
      - name: Build ALIEN
        run: cmake --build build --config Release --parallel

      # 7. Publish the Windows executable
      - name: Upload alien.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: alien-win
          path: build/Release/alien.exe
