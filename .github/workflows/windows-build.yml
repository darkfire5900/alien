name: CI Build ALIEN (Ubuntu + CUDA sm_120)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout source
      - uses: actions/checkout@v3                         # official checkout action :contentReference[oaicite:8]{index=8}

      # 2) Install CMake, Ninja & system deps
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev libglu-dev :contentReference[oaicite:9]{index=9}

      # 3) Install CUDA Toolkit 12.4 via action
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.22                 # installs CUDA and sets CUDA_PATH :contentReference[oaicite:10]{index=10}
        with:
          cuda: '12.4.0'

      # 4) Bootstrap vcpkg  
      - name: Bootstrap vcpkg
        run: |
          git clone --depth=1 https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          $VCPKG_ROOT/bootstrap-vcpkg.sh

      # 5) Configure & build with CMake  
      - name: Configure & Build
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCUDA_ARCHITECTURES=120
          cmake --build build --config $BUILD_TYPE -- -j$(nproc)

      # 6) Upload build artifacts  
      - name: Upload binaries
        uses: actions/upload-artifact@v4                 # v4 avoids v3 upload‑artifact deprecation :contentReference[oaicite:11]{index=11}
        with:
          name: alien-linux
          path: build/
