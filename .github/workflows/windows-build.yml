name: Build ALIEN Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Bootstrap vcpkg
        uses: microsoft/vcpkg-action@v2
      - name: Install CUDA Toolkit
        uses: cuda-toolkit@v1
      - name: Configure with CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCUDA_ARCHITECTURES=120
      - name: Build Release
        run: cmake --build build --config Release -- -m
      - name: Upload Executable
        uses: actions/upload-artifact@v3
        with:
          name: ALIEN-windows
          path: build/Release/alien.exe
