name: Build ALIEN for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    defaults:
      run:
        shell: powershell

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install CMake (no cache, latest v2 action)
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.2'
        # This action simply downloads CMake; it never hits the legacy cache :contentReference[oaicite:0]{index=0}

      # 3. Install CUDA 12.4 runtime (matching ALIEN build)
      - name: Install CUDA runtime
        run: choco install cuda --version=12.4.1.551 -y
        # Ensures the driver exposes the CUDA 12.4 runtime DLLs :contentReference[oaicite:1]{index=1}

      # 4. Bootstrap dependencies with vcpkg
      - name: Bootstrap vcpkg
        uses: microsoft/vcpkg-action@v2
        # Handles vcpkg install & caching for your libraries :contentReference[oaicite:2]{index=2}

      # 5. Configure CMake for compute capability 12.0 (Blackwell)
      - name: Configure ALIEN with sm_120
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCUDA_ARCHITECTURES=120
        # Embeds both cubin+PTX for CC 12.0 so your RTX 5070 will run it :contentReference[oaicite:3]{index=3}

      # 6. Build the project
      - name: Build ALIEN
        run: cmake --build build --config Release --parallel

      # 7. Upload the resulting alien.exe
      - name: Upload alien.exe
        uses: actions/upload-artifact@v4
        with:
          name: alien-win
          path: build/Release/alien.exe
        # v4 of upload-artifact is the supported version post-deprecation 
